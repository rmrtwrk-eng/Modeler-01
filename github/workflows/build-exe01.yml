name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy ezdxf pyinstaller

      - name: Run unit tests
        run: python tests/test_modeler.py

      - name: Build ShipStab.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ShipStab
          --collect-submodules scipy.interpolate --collect-all ezdxf shipstab_app.py

      - name: Check the exe was produced
        shell: pwsh
        run: |
          if (-not (Test-Path dist/ShipStab.exe)) { throw "dist/ShipStab.exe missing" }
          "{0:N1} MB" -f ((Get-Item dist/ShipStab.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: ShipStab-windows-exe
          path: dist/ShipStab.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ShipStab.exe
